# 통합 테스트용 PostgreSQL 16 (internal/store/pg_integration_test.go)
# 사용:
#   docker compose -f deploy/docker-compose.test.yml up -d
#   LM_TEST_DB="postgres://postgres:postgres@localhost:5433/lm_test?sslmode=disable" go test ./internal/store/
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: lm_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
