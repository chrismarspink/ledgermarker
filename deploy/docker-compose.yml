# LM Phase 1 실증 스택: PostgreSQL 16 + LM Server
# 사용: docker compose -f deploy/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgermarker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-in-prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  lmserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 마이그레이션은 서버 기동 시 자동 적용된다.
      # 운영에서는 lm_app 롤(UPDATE/DELETE 권한 없음)로 접속할 것 —
      # 0002_app_role.up.sql 적용 후 비밀번호 교체 필수.
      LM_DB_URL: postgres://postgres:change-me-in-prod@db:5432/ledgermarker?sslmode=disable
      LM_ISSUER_ORG: KPOST
      LM_ADDR: ":8080"
      # LM_API_KEYS: "key1,key2"      # 설정 시 비공개 엔드포인트 보호
      # LM_REGRADE_TOKEN: "..."       # 등급 하향 승인 토큰
    volumes:
      - keystore:/keystore
    ports:
      - "8080:8080"

volumes:
  pgdata:
  keystore:
