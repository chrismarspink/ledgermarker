# 웹(PWA)을 GitHub Pages 에 정적 배포한다.
# Pages 는 정적 파일만 서비스하므로 화면은 뜨지만 검증·원장·유사도 API 는 서버(lmserver)가 있어야 동작한다.
# 서버가 없으면 정적 데모 모드로 빌드된다(원장·키·협정 스냅샷 조회만 가능, 발급·검증 불가).
# 서버를 따로 띄우면 Actions variable LM_SERVER_URL 에 그 주소를 주면 실서버를 호출한다.
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verify-pwa/package-lock.json
      - run: npm ci
      - run: npm run build -- --base=/ledgermarker/
        env:
          VITE_LM_SERVER: ${{ vars.LM_SERVER_URL }}
          # 서버 주소가 없으면 정적 데모: public/v1 스냅샷(scripts/snapshot-static-api.sh)으로 조회만 동작
          VITE_LM_STATIC: ${{ vars.LM_SERVER_URL == '' && '1' || '0' }}
      - run: cp dist/index.html dist/404.html   # SPA 딥링크(/verify 등) 대응
      - uses: actions/upload-pages-artifact@v3
        with:
          path: verify-pwa/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
